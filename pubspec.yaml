name: monggo_sholat
description: Ngibadah apps

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio:
  tanggal_indonesia:
  google_fonts:
  geolocator: ^12.0.0
  arabic_numbers:
  assets_audio_player:
    git:
      url: https://github.com/florent37/Flutter-AssetsAudioPlayer
  flutter_switch:
  list_tile_switch:
  provider: ^6.0.2
  get_it: ^8.0.3
  flutter_countdown_timer: ^4.1.0
  shared_preferences: ^2.0.13
  location: ^7.0.0
  flutter_geocoder:
    git: https://github.com/taufiqjack/flutter_geocoder

  rflutter_alert: ^2.0.4
  fluttertoast: ^8.0.9
  json_to_model: ^3.1.4
  quiver: ^3.0.1+1
  font_awesome_flutter: ^10.1.0
  flutter_widget_from_html: ^0.16.0
  sqflite: ^2.0.2+1
  path_provider: ^2.0.9
  change_app_package_name: ^1.1.0
  hijriyah_indonesia: ^0.1.2
  hive: ^2.2.3
  hive_generator: ^2.0.0
  flutter_bloc: ^9.1.0
  flutter_dotenv: ^5.1.0
  geocoding: ^3.0.0
  easy_localization: ^3.0.7+1
  alice: ^0.4.2
  awesome_dialog: ^3.2.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0-0.0.dev
  json_serializable: ^6.9.0

flutter_icons:
  image_path: "assets/images/ngibadah_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/screenshoot/
    - assets/translations/
    - .env
